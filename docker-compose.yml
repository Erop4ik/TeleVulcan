# TeleVulcan — hardened deployment.
#   bot         : the Telegram bot + link page, no ports published to the host
#   cloudflared : Cloudflare Tunnel that exposes the link page over HTTPS without opening
#                 any inbound port (the server IP stays hidden)
#
#   cp .env.example .env   # fill BOT_TOKEN, SECRET_KEY, PUBLIC_URL, VULCAN_SYMBOL, TUNNEL_TOKEN
#   docker compose up -d --build

services:
  bot:
    build: .
    image: televulcan:latest
    container_name: televulcan
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/vulcanbot.sqlite3
      WEB_PORT: "8765"
    volumes:
      - televulcan-data:/data
    networks: [internal]
    # --- hardening ---
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.50"
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: televulcan-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [bot]
    networks: [internal]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    user: "65532:65532"
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

networks:
  internal:
    driver: bridge

volumes:
  televulcan-data:
