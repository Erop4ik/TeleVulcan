<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VulcanBot — привязка дневника</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; line-height: 1.45; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input[type=text], input[type=password] { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
  .err { background: #fdd; color: #700; padding: 10px; border-radius: 6px; }
  .note { font-size: 14px; opacity: .85; }
  .consent { display: flex; gap: 8px; align-items: flex-start; margin-top: 14px; font-weight: normal; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
